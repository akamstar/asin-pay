name: paiement-asin

x-backend-env: &backend-env
  APP_NAME: "Demande d'actes"
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?APP_KEY manquant (copier .env.example en .env)}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_LOCALE: fr
  APP_FALLBACK_LOCALE: fr
  APP_FAKER_LOCALE: fr_FR
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-backend}
  DB_USERNAME: ${DB_USERNAME:-asin}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FRAIS_DOSSIER: ${FRAIS_DOSSIER:-100}
  DEMANDE_QUANTITE_MAX: ${DEMANDE_QUANTITE_MAX:-10}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-backend}
      POSTGRES_USER: ${DB_USERNAME:-asin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    environment:
      <<: *backend-env
      # Au démarrage : migrations + seed du catalogue, puis mise en cache (config, routes, vues)
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_SEED: "true"
      # Sonde de l'image de base pointée sur la route santé de Laravel
      HEALTHCHECK_PATH: /up

  # Tests PHPUnit sur PostgreSQL : docker compose run --rm backend-test
  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      APP_ENV: testing
      DB_DATABASE: backend_test

  payement:
    build:
      context: ./payement
    restart: unless-stopped
    ports:
      - "${PAYMENT_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      API_KEY: ${PAYMENT_API_KEY:?PAYMENT_API_KEY manquant (copier .env.example en .env)}
      WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-http://backend:8080/api/v1/webhooks/paiement}
      SIGNING_PRIVATE_KEY: ${PAYMENT_SIGNING_PRIVATE_KEY:?PAYMENT_SIGNING_PRIVATE_KEY manquant}
      SIGNING_KEY_ID: ${PAYMENT_SIGNING_KEY_ID:-payement-dev}
      MIN_DELAY: ${PAYMENT_MIN_DELAY:-3s}
      MAX_DELAY: ${PAYMENT_MAX_DELAY:-10s}
      WEBHOOK_MAX_ATTEMPTS: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:-3}
      WEBHOOK_BACKOFF: ${PAYMENT_WEBHOOK_BACKOFF:-1s}

volumes:
  postgres-data:
